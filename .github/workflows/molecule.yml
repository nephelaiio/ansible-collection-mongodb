---
name: molecule
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  molecule:
    name: molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario:
          - install
          - offline
          - online
          - stop
          - start
          - restart
          - upgrade
        image:
          - ubuntu2404
        include:
          - scenario: install
            image: ubuntu2204
          - scenario: install
            image: debian12
    steps:
      - name: Run devbox tests
        uses: pokerops/ansible-utils@master
        with:
          run: >
            just
            --set MOLECULE_SCENARIO ${{ matrix.scenario }}
            --set MOLECULE_DOCKER_IMAGE ${{ matrix.image }}
            requirements test

      - name: Upload install logs
        uses: actions/upload-artifact@v7
        with:
          name: molecule-${{ matrix.scenario }}-${{ matrix.image }}.log
          path: |
            /tmp/logs/*
          if-no-files-found: ignore
        if: always()
