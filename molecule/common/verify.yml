---
- name: Verify shard registration
  hosts: mongodb_mongos
  tasks:
    - name: Verify shard registration
      run_once: true
      tags: skip_ansible_lint
      block:
        - name: Query registered shards
          community.mongodb.mongodb_shell:
            db: "admin"
            eval: "db.runCommand({listShards: 1})"
          register: _shard_query

        - name: Verify shard registration
          ansible.builtin.fail:
            msg: "Shard {{ item }} has not been registered"
          vars:
            _output: "{{ _shard_query.transformed_output | default({}) }}"
            _shard_ids: "{{ _output.shards | map(attribute='_id') }}"
            _id_not_found: "{{ item not in _shard_ids }}"
          when: _id_not_found | bool
          loop:
            - shard1
          tags: skip_ansible_lint
