- name: Update Mongos nodes
  hosts: "{{ __mongodb_mongos }}:!{{ mongodb_update_skip_group | default('mongodb_update_skip') }}"
  become: true
  serial: 1
  any_errors_fatal: true
  vars_files:
    - main.yml
  vars:
    update_reboot: false
    update_cache_valid_time: 1
    consul_service: consul
  roles:
    - nephelaiio.mongodb.update
  tasks:
    - name: Include virtualenv tasks
      ansible.builtin.include_tasks: ./tasks/virtualenv.yml
      vars:
        mongodb_virtualenv_manage: true

    - name: Stop Mongos services
      block:
        - name: Include Mongos service tasks
          ansible.builtin.include_role:
            name: nephelaiio.mongodb.mongos
            tasks_from: service
          vars:
            mongodb_service_state: stopped

        - name: Gather service facts
          ansible.builtin.service_facts:

        - name: Stop Consul service
          ansible.builtin.service:
            name: consul
            state: stopped
          when: consul_service in services

        - name: Reboot node
          ansible.builtin.reboot:

        - name: Check Mongos cluster status
          community.mongodb.mongodb_shell:
            login_database: "admin"
            eval: "sh.status()"
          retries: "{{ _mongodb_reconfig_poll }}"
          delay: "{{ _mongodb_reconfig_interval }}"
          changed_when: false

        - name: Manage consul start tasks
          when: consul_service in services
          block:
            - name: Start Consul service
              ansible.builtin.service:
                name: consul
                state: started

            - name: Check Consul startup
              ansible.builtin.shell: "consul members listNode | grep {{ inventory_hostname }} | awk '{print $3}'"
              register: _consul_node_status
              retries: "{{ _mongodb_reconfig_poll }}"
              delay: "{{ _mongodb_reconfig_interval }}"
              until: _consul_node_status.stdout == "alive"
              changed_when: false
              no_log: true
              tags: skip_ansible_lint

      always:
        - name: Include virtualenv tasks
          ansible.builtin.include_tasks: ./tasks/virtualenv.yml
          vars:
            mongodb_virtualenv_manage: false
