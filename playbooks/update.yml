---
- name: Deploy virtualenv tools
  ansible.builtin.import_playbook: nephelaiio.mongodb.virtualenv

- name: Update config nodes
  serial: 1
  hosts: "{{ __mongodb_config }}:!{{ mongodb_update_skip_group | default('mongodb_update_skip') }}"
  become: true
  any_errors_fatal: true
  vars_files:
    - main.yml
  vars:
    update_reboot: false
    update_cache_valid_time: 1
    consul_service: consul
  roles:
    - nephelaiio.mongodb.update
  tasks:
    - name: Include virtualenv tasks
      ansible.builtin.include_tasks: ./tasks/virtualenv.yml
      vars:
        mongodb_virtualenv_manage: true

    - name: Stop Mongos services
      block:
        - name: Include Mongos service tasks
          ansible.builtin.include_role:
            name: nephelaiio.mongodb.mongodb
            tasks_from: service
          vars:
            mongodb_service_state: stopped

        - name: Gather service facts
          ansible.builtin.service_facts:

        - name: Stop Consul service
          ansible.builtin.service:
            name: "{{ _service }}"
            state: stopped
          when: consul_service in services

        - name: Reboot node
          ansible.builtin.reboot:

        - name: Wait for replica set to stabilize
          community.mongodb.mongodb_status:
            replica_set: "{{ mongos_replicaset_config_name | default('config') }}"
            validate: minimal
            poll: "{{ _mongodb_reconfig_poll }}"
            interval: "{{ _mongodb_reconfig_interval }}"

        - name: Manage consul start tasks
          when: consul_service in services
          block:
            - name: Start Consul service
              ansible.builtin.service:
                name: consul
                state: started

            - name: Check Consul startup
              ansible.builtin.shell: "consul members listNode | grep {{ inventory_hostname }} | awk '{print $3}'"
              register: _consul_node_status
              retries: "{{ _mongodb_reconfig_poll }}"
              delay: "{{ _mongodb_reconfig_interval }}"
              until: _consul_node_status.stdout == "alive"
              changed_when: false
              no_log: true
              tags: skip_ansible_lint

      always:
        - name: Include virtualenv tasks
          ansible.builtin.include_tasks: ./tasks/virtualenv.yml
          vars:
            mongodb_virtualenv_manage: false

